name: devbox-python

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/devbox-python.yml"]
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild for Debian/Python security updates
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: python
          platforms: linux/amd64
          push: true
          pull: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SSH-reachable Python dev box for the home cluster
          tags: |
            ghcr.io/${{ github.repository_owner }}/devbox-python:latest
            ghcr.io/${{ github.repository_owner }}/devbox-python:${{ steps.tags.outputs.date }}-${{ steps.tags.outputs.sha }}
